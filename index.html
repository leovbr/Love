<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#030712" />
  <title>For You 💙</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="scene">
    <div class="topline"><span class="pulse-dot"></span> A LITTLE SOMETHING FOR YOU</div>
    <canvas id="heartCanvas" aria-label="A glowing blue heart made of moving particles"></canvas>
    <section class="message">
      <p class="eyebrow">SOMEWHERE IN THIS UNIVERSE</p>
      <h1>You are my<br><em>favorite constellation.</em></h1>
      <p class="sub">Even among a million stars, my eyes would still look for you.</p>
      <button id="replayBtn" type="button"><span>↻</span> Watch it again</button>
    </section>
    <div class="footer">MADE WITH <span>♥</span> JUST FOR YOU</div>
  </main>
  <script src="script.js"></script>
</body>
</html>
